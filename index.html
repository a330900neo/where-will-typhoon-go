<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Favicon & App Icons -->
    <link rel="icon" type="image/png" href="https://github.com/a330900neo/where-will-typhoon-go/blob/main/icon.png?raw=true">
    <link rel="apple-touch-icon" href="https://github.com/a330900neo/where-will-typhoon-go/blob/main/icon.png?raw=true">

    <!-- Open Graph / Facebook / Discord -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://a330900neo.github.io/where-will-typhoon-go/">
    <meta property="og:title" content="颱風會去邊">
    <meta property="og:description" content="打唔打得成風？颱風會去邊？大家一齊估啦">
    <meta property="og:image" content="https://github.com/a330900neo/where-will-typhoon-go/blob/main/icon.png?raw=true">

    <!-- Discord Embed Theme Color -->
    <meta name="theme-color" content="#ff4757">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:url" content="https://a330900neo.github.io/where-will-typhoon-go/">
    <meta name="twitter:title" content="颱風會去邊">
    <meta name="twitter:description" content="打唔打得成風？颱風會去邊？大家一齊估啦">
    <meta name="twitter:image" content="https://github.com/a330900neo/where-will-typhoon-go/blob/main/icon.png?raw=true">
    <title>颱風會去邊</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        :root {
            --bg-glass: rgba(20, 20, 25, 0.75); --bg-glass-light: rgba(255, 255, 255, 0.95);
            --border-glass: rgba(255, 255, 255, 0.18); --primary-accent: #ff4757;
            --success-accent: #2ed573; --warning-accent: #ffa502; --secondary-accent: #747d8c;
            --text-light: #ffffff; --text-dark: #2f3542; --radius-main: 16px;
            --shadow-main: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
        }

        * { box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; background: #eef2f3; }
        #map { height: 100vh; width: 100vw; z-index: 1; }
        .map-drawing-mode { cursor: crosshair !important; }

        .glass-panel {
            background: var(--bg-glass); backdrop-filter: blur(12px); border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-main); border-radius: var(--radius-main); color: var(--text-light);
        }

        #top-controls {
            position: absolute; top: 20px; left: 20px; right: 20px; z-index: 1001; 
            display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none;
        }

        .top-btn {
            padding: 10px 16px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid var(--border-glass);
            border-radius: 12px; background: var(--bg-glass-light); color: var(--text-dark);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); pointer-events: auto; display: flex; align-items: center; gap: 6px;
        }
        
        #center-bar {
            display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 250px; align-items: center; pointer-events: auto;
        }
        
        #status-bar {
            background: var(--bg-glass-light); color: var(--text-dark); padding: 10px 20px;
            border-radius: 30px; font-weight: 700; font-size: 15px; text-align: center; width: 100%;
        }
        #typhoon-selector {
            padding: 8px 12px; border-radius: 12px; font-weight: 600; width: 100%; border: 1px solid var(--border-glass); background: var(--bg-glass-light);
        }

        #ui-container {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 1000;
            padding: 16px; width: 90%; max-width: 400px; display: flex; flex-direction: column; gap: 12px;
        }

        .btn {
            padding: 14px; border: none; border-radius: 10px; font-size: 16px; font-weight: 700;
            cursor: pointer; text-align: center; color: white;
        }
        #btn-draw { background: var(--primary-accent); }
        .draw-controls { display: none; grid-template-columns: 1fr 1fr; gap: 10px; }
        #btn-submit { background: var(--success-accent); grid-column: span 2; }
        #btn-undo { background: var(--warning-accent); }
        #btn-cancel { background: var(--secondary-accent); }

        .overlay {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.7); z-index: 9999; display: none; align-items: center; justify-content: center;
        }
        .modal-panel {
            background: var(--bg-glass-light); padding: 24px; border-radius: var(--radius-main);
            width: 90%; max-width: 360px; color: var(--text-dark); position: relative; max-height: 80vh; overflow-y: auto;
        }
        .close-btn { position: absolute; top: 12px; right: 16px; font-size: 20px; cursor: pointer; color: #999; }
        
        .leaderboard-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #ddd;}
        .leaderboard-item:last-child { border-bottom: none; }
        .rank { font-weight: bold; color: var(--primary-accent); width: 30px; }
    </style>
</head>
<body>

    <div id="top-controls">
        <button id="btn-top-login" class="top-btn">👤 登入</button>
        <div id="center-bar">
            <div id="status-bar">揾緊風...</div>
            <select id="typhoon-selector" style="display:none;"></select>
        </div>
        <button id="btn-leaderboard" class="top-btn">🏆 排行</button>
    </div>

    <!-- Auth Overlay -->
    <div id="auth-overlay" class="overlay">
        <div class="modal-panel" style="text-align: center;">
            <span class="close-btn" onclick="document.getElementById('auth-overlay').style.display='none'">✖</span>
            <h2 id="auth-title">登入 / Login</h2>
            <div id="g_id_onload" data-client_id="848668931991-smd16mnf0hripqncg6dajp4i0c9l1qnl.apps.googleusercontent.com" data-callback="handleGoogleLogin" data-auto_prompt="false"></div>
            <div id="google-btn-container" style="display:flex; justify-content:center;">
                <div class="g_id_signin" data-type="standard"></div>
            </div>
            <div id="username-setup" style="display:none; margin-top:15px;">
                <input type="text" id="username-input" placeholder="改個名" maxlength="15" style="width:100%; padding:10px; margin-bottom:10px;">
                <button id="btn-save-username" class="btn" style="width:100%; background:var(--success-accent);">儲存</button>
            </div>
        </div>
    </div>

    <!-- Leaderboard Overlay -->
    <div id="board-overlay" class="overlay">
        <div class="modal-panel">
            <span class="close-btn" onclick="document.getElementById('board-overlay').style.display='none'">✖</span>
            <h2>🏆 準確度排行榜</h2>
            <p style="font-size:12px; color:#666;">根據路徑與最終位置評分。首估佔40%，其餘平分。每3小時更新。</p>
            <div id="leaderboard-list"></div>
        </div>
    </div>

    <div id="map"></div>
    
    <div id="ui-container" class="glass-panel">
        <button id="btn-draw" class="btn">✏️ 點擊去估</button>
        <div id="draw-controls" class="draw-controls">
            <button id="btn-undo" class="btn">↩️ 回帶</button>
            <button id="btn-cancel" class="btn">❌ 唔估</button>
            <button id="btn-submit" class="btn">🚀 落注</button>
        </div>
    </div>

<script>
    const API_BASE_URL = "https://typhoon-backend.someonechannel330.workers.dev";
    
    // Auth State
    function getUserId() {
        let uid = localStorage.getItem('typhoon_user_id');
        if (!uid) { uid = 'anon_' + crypto.randomUUID(); localStorage.setItem('typhoon_user_id', uid); }
        return uid;
    }
    let USER_ID = getUserId();
    let USERNAME = localStorage.getItem('typhoon_username') || null;
    let tempGoogleData = {};

    function updateAuthUI() {
        const btn = document.getElementById('btn-top-login');
        if (USERNAME) { btn.innerHTML = `👤 ${USERNAME}`; btn.style.pointerEvents = 'none'; }
    }
    updateAuthUI();

    document.getElementById('btn-top-login').addEventListener('click', () => document.getElementById('auth-overlay').style.display = 'flex');

    // FIXED GOOGLE LOGIN: Checks DB across devices
    window.handleGoogleLogin = async function(response) {
        try {
            const res = await fetch(`${API_BASE_URL}/api/auth`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: response.credential })
            });
            const data = await res.json();
            
            if (data.requires_username) {
                tempGoogleData = { id: data.user_id, email: data.email };
                document.getElementById('google-btn-container').style.display = 'none';
                document.getElementById('username-setup').style.display = 'block';
            } else if (data.username) {
                USER_ID = data.user_id; USERNAME = data.username;
                localStorage.setItem('typhoon_user_id', USER_ID); localStorage.setItem('typhoon_username', USERNAME);
                updateAuthUI(); document.getElementById('auth-overlay').style.display = 'none';
            }
        } catch(e) { alert("登入失敗"); }
    };

    document.getElementById('btn-save-username').addEventListener('click', async () => {
        const name = document.getElementById('username-input').value.trim();
        if(!name) return alert("請輸入名");
        
        try {
            const res = await fetch(`${API_BASE_URL}/api/set-username`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ user_id: tempGoogleData.id, email: tempGoogleData.email, username: name })
            });
            const data = await res.json();
            if (data.success) {
                USER_ID = tempGoogleData.id; USERNAME = name;
                localStorage.setItem('typhoon_user_id', USER_ID); localStorage.setItem('typhoon_username', USERNAME);
                updateAuthUI(); document.getElementById('auth-overlay').style.display = 'none';
            } else { alert(data.error); }
        } catch(e) {}
    });

    // MAP & TYPHOON LOGIC
    const map = L.map('map', { zoomControl: false, doubleClickZoom: false }).setView([22.3, 114.16], 6);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png').addTo(map);
    // Custom Low Pressure Icon (Black circle, hollow L)
    const lowPressureIcon = L.divIcon({
        className: 'custom-div-icon',
        html: `<div style="background-color: black; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 16px; -webkit-text-stroke: 1.5px white; color: black; box-shadow: 0 2px 5px rgba(0,0,0,0.4);">L</div>`,
        iconSize: [24, 24],
        iconAnchor: [12, 12]
    });
    
    let drawingMarker = null; // Used to track the 'L' while drawing
    let activeTyphoons = [];
    let currentTyphoonId = null;
    let currentTyphoonLocation = null;
    let currentCoordinates = [];
    let predictionLayers = [];

    async function initApp() {
        try {
            document.getElementById('status-bar').innerText = "揾緊風...";
            
            // 1. Fetch Active HKO using YOUR secure worker proxy
            const targetUrl = encodeURIComponent("https://www.weather.gov.hk/wxinfo/currwx/tc_list.xml");
            let listXmlText = await fetch(`${API_BASE_URL}/api/proxy?url=${targetUrl}`).then(r => r.text());
            
            const parser = new DOMParser();
            const doc = parser.parseFromString(listXmlText, "text/xml");
            
            const tcNodes = doc.querySelectorAll("TropicalCyclone, tropicalcyclone");
            tcNodes.forEach(node => {
                activeTyphoons.push({
                    id: (node.querySelector("TropicalCycloneID") || node.querySelector("tropicalcycloneid"))?.textContent.trim(),
                    name: (node.querySelector("TropicalCycloneChineseName") || node.querySelector("tropicalcycloneenglishname"))?.textContent.trim(),
                    url: (node.querySelector("TropicalCycloneURL") || node.querySelector("tropicalcycloneurl"))?.textContent.trim(),
                    isActive: true
                });
            });

            // 2. Fetch 36-hour memory from Backend
            // 2. Fetch 36-hour memory from Backend
            try {
                const recentRes = await fetch(`${API_BASE_URL}/api/recent-typhoons`);
                const recentDb = await recentRes.json();
                recentDb.forEach(dbTc => {
                    if (!activeTyphoons.find(t => t.id === dbTc.id)) {
                        activeTyphoons.push({ 
                            id: dbTc.id, 
                            name: dbTc.name.includes("已結束") ? dbTc.name : dbTc.name + " (死咗)", 
                            url: null, 
                            isActive: false,
                            actualPath: dbTc.actual_path ? JSON.parse(dbTc.actual_path) : []
                        });
                    }
                });
            } catch(e) {}

            const selector = document.getElementById('typhoon-selector');
            if (activeTyphoons.length > 0) {
                selector.style.display = 'block';
                activeTyphoons.forEach(tc => {
                    const opt = document.createElement('option'); opt.value = tc.id; opt.text = tc.name; selector.appendChild(opt);
                });
                selector.addEventListener('change', (e) => loadTyphoonTrack(activeTyphoons.find(t => t.id === e.target.value)));
                loadTyphoonTrack(activeTyphoons[0]);
            } else {
                document.getElementById('status-bar').innerText = "唔洗諗住打風";
            }
        } catch(e) { 
            console.error(e);
            document.getElementById('status-bar').innerText = "load唔到"; 
        }
    }

    async function loadTyphoonTrack(tc) {
        currentTyphoonId = tc.id;
        document.getElementById('status-bar').innerText = `stalking ${tc.name}`;
        map.eachLayer(layer => { if(!!layer.toGeoJSON) map.removeLayer(layer); }); // Clear old paths
        
        let actualPathData = [];
        let isLowPressure = false;
        currentTyphoonLocation = null; // Default to null; only enable if active & not low pressure
        
        if (tc.isActive && tc.url) {
            try {
                const targetUrl = encodeURIComponent(tc.url);
                const xmlText = await fetch(`${API_BASE_URL}/api/proxy?url=${targetUrl}`).then(r => r.text());
                const xml = new DOMParser().parseFromString(xmlText, "text/xml");
                
                xml.querySelectorAll("PastInformation, pastinformation").forEach(n => {
                    let lat = parseFloat((n.querySelector("Latitude") || n.querySelector("latitude"))?.textContent);
                    let lon = parseFloat((n.querySelector("Longitude") || n.querySelector("longitude"))?.textContent);
                    if(lat && lon) actualPathData.push([lat, lon]);
                });

                const analysis = xml.querySelector("AnalysisInformation") || xml.querySelector("analysisinformation");
                if (analysis) {
                    let cLat = parseFloat((analysis.querySelector("Latitude")||analysis.querySelector("latitude")).textContent);
                    let cLon = parseFloat((analysis.querySelector("Longitude")||analysis.querySelector("longitude")).textContent);
                    
                    actualPathData.push([cLat, cLon]);
                    
                    let intensity = (analysis.querySelector("Intensity") || analysis.querySelector("intensity"))?.textContent.trim() || '';
                    let wind = (analysis.querySelector("MaximumWind") || analysis.querySelector("maximumwind"))?.textContent.trim() || '';
                    
                    // Check if dissipated into Low Pressure Area
                    isLowPressure = intensity.includes("Low Pressure") || intensity.includes("低壓區") || intensity.includes("低壓");
                    tc.isLowPressure = isLowPressure;

                    let popupText = `<div style="text-align:center;"><b>${tc.name}</b>`;
                    if (intensity || wind) popupText += `<br><span style="font-size:12px; color:#666;">${intensity} ${wind ? '| '+wind : ''}</span>`;
                    popupText += `</div>`;

                    if (isLowPressure) {
                        // Place hollow L icon at final position for Low Pressure Area
                        L.marker([cLat, cLon], { icon: lowPressureIcon }).addTo(map).bindPopup(popupText).openPopup();
                        document.getElementById('status-bar').innerText = `${tc.name} (已減弱為低壓區)`;
                    } else {
                        currentTyphoonLocation = [cLat, cLon];
                        L.marker([cLat, cLon]).addTo(map).bindPopup(popupText).openPopup();
                        document.getElementById('status-bar').innerText = `stalking ${tc.name}${intensity ? ' ('+intensity+')' : ''}`;
                    }
                }

                // Sync actual path to DB
                if(actualPathData.length > 0) {
                    L.polyline(actualPathData, { color: '#000', weight: 3, dashArray: '5,5' }).addTo(map);
                    fetch(`${API_BASE_URL}/api/sync-typhoon`, {
                        method: 'POST', 
                        headers:{'Content-Type':'application/json'},
                        body: JSON.stringify({ id: tc.id, name: tc.name.replace(" (已結束)",""), actual_path: actualPathData })
                    });
                }
            } catch(e) { console.error("Error loading typhoon data:", e); }
        } else if (!tc.isActive && tc.actualPath && tc.actualPath.length > 0) {
            // HISTORICAL / ENDED TYPHOON: Render actual path & hollow L at end point
            actualPathData = tc.actualPath;
            let lastPoint = actualPathData[actualPathData.length - 1];
            
            L.polyline(actualPathData, { color: '#000', weight: 3, dashArray: '5,5' }).addTo(map);
            L.marker(lastPoint, { icon: lowPressureIcon }).addTo(map)
                .bindPopup(`<div style="text-align:center;"><b>${tc.name}</b><br><span style="font-size:12px; color:#666;">低壓區 (死咗)</span></div>`)
                .openPopup();
                
            document.getElementById('status-bar').innerText = `${tc.name}`;
        }

        fetchAndRenderPredictions();
    }

    // Leaderboard Trigger
    // Leaderboard Trigger
    document.getElementById('btn-leaderboard').addEventListener('click', async () => {
        if (!currentTyphoonId) return;
        
        // 1. Get the name of the currently selected typhoon
        const currentTc = activeTyphoons.find(t => t.id === currentTyphoonId);
        const tcName = currentTc ? currentTc.name.replace(" (已結束)", "") : '';

        // 2. Update the Leaderboard title to show which typhoon is being viewed
        const boardTitle = document.querySelector('#board-overlay h2');
        if (boardTitle) boardTitle.innerHTML = `🏆 ${tcName} 準確度排行榜`;

        const listDiv = document.getElementById('leaderboard-list');
        listDiv.innerHTML = "載入中...";
        document.getElementById('board-overlay').style.display = 'flex';
        
        try {
            const res = await fetch(`${API_BASE_URL}/api/leaderboard?typhoon_id=${currentTyphoonId}`);
            const data = await res.json();
            
            if (data.length === 0) { listDiv.innerHTML = "一係冇人一係冇風"; return; }
            
            listDiv.innerHTML = data.map((u, i) => `
                <div class="leaderboard-item">
                    <div>
                        <span class="rank">#${i+1}</span> <b>${u.username}</b>
                        <span style="font-size:11px;color:#888;margin-left:5px;">(${u.guesses}次估)</span>
                    </div>
                    <div style="font-weight:bold; color:var(--success-accent);">${u.score}%</div>
                </div>
            `).join('');
        } catch (err) { listDiv.innerHTML = "載入失敗"; }
    });

    // Submitting (Remaining drawing logic is mostly identical)
    document.getElementById('btn-draw').addEventListener('click', () => {
        const currentTc = activeTyphoons.find(t => t.id === currentTyphoonId);
        if (!currentTyphoonLocation || (currentTc && (!currentTc.isActive || currentTc.isLowPressure))) {
            return alert("該熱帶氣旋已減弱為低壓區或死咗，無法再落注。");
        }
        
        // Cooldown Logic
        const isAnon = !USERNAME;
        const cooldownMs = (isAnon ? 6 : 3) * 60 * 60 * 1000;
        const lastPost = localStorage.getItem(`last_post_${currentTyphoonId}_${USER_ID}`);
        
        if (lastPost) {
            const timeDiff = Date.now() - parseInt(lastPost);
            if (timeDiff < cooldownMs) {
                const hoursLeft = ((cooldownMs - timeDiff) / (1000 * 60 * 60)).toFixed(1);
                return alert(`冷卻中！請等 ${hoursLeft} 小時後再落注。\n(登入用戶冷卻 3 小時，訪客 6 小時)`);
            }
        }

        document.getElementById('map').classList.add('map-drawing-mode');
        document.getElementById('btn-draw').style.display = 'none';
        document.getElementById('draw-controls').style.display = 'grid';
        currentCoordinates = [currentTyphoonLocation];

        if (drawingMarker) map.removeLayer(drawingMarker);
        drawingMarker = L.marker(currentTyphoonLocation, { icon: lowPressureIcon }).addTo(map);
    });

    map.on('click', (e) => {
        if(document.getElementById('draw-controls').style.display === 'grid') {
            currentCoordinates.push([e.latlng.lat, e.latlng.lng]);
            
            // Draw the line connecting points
            L.polyline(currentCoordinates, { color: '#ff4757', weight: 4 }).addTo(map);
            
            // Move the L marker to the newest click
            drawingMarker.setLatLng(e.latlng);
        }
    });

    document.getElementById('btn-cancel').addEventListener('click', () => location.reload()); // Quick reset

    document.getElementById('btn-submit').addEventListener('click', async () => {
        if (currentCoordinates.length < 2) return alert("請畫線");
        try {
            await fetch(`${API_BASE_URL}/api/submit`, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ id: 'p_'+Date.now(), typhoon_id: currentTyphoonId, user_id: USER_ID, path_data: currentCoordinates })
            });
            
            // Save timestamp for the cooldown check
            localStorage.setItem(`last_post_${currentTyphoonId}_${USER_ID}`, Date.now().toString());
            
            location.reload();
        } catch(e) { alert("落注失敗"); }
    });

    async function fetchAndRenderPredictions() {
        const res = await fetch(`${API_BASE_URL}/api/predictions?typhoon_id=${currentTyphoonId}`);
        const preds = await res.json();

        // Check if user is currently in cooldown (already submitted)
        const isAnon = !USERNAME;
        const cooldownMs = (isAnon ? 6 : 3) * 60 * 60 * 1000;
        const lastPost = localStorage.getItem(`last_post_${currentTyphoonId}_${USER_ID}`);
        const isSubmitted = lastPost && (Date.now() - parseInt(lastPost) < cooldownMs);

        // Check if the typhoon is inactive/ended
        const currentTc = activeTyphoons.find(t => t.id === currentTyphoonId);
        const isEnded = currentTc && !currentTc.isActive;

        preds.forEach(p => {
            let coords = JSON.parse(p.path_data);
            if (!coords || coords.length === 0) return;

            let isMine = p.user_id === USER_ID;
            let lastPoint = coords[coords.length - 1]; // The final prediction coordinate

            // HIDE logic: If user CAN submit (not in cooldown) AND typhoon is active, hide other users' guesses
            if (!isSubmitted && !isEnded && !isMine) {
                return; // Skip rendering other people's paths
            }

            // Draw line
            L.polyline(coords, { 
                color: isMine ? '#ff4757' : '#1e90ff', 
                opacity: isMine ? 1 : 0.4, 
                weight: isMine ? 4 : 2 
            }).addTo(map);

            // Draw last point indicator
            if (isMine) {
                // Own drawing: Black circle with hollow L
                L.marker(lastPoint, { icon: lowPressureIcon }).addTo(map).bindPopup("你嘅落注終點");
            } else {
                // Others: Small dot marker
                L.circleMarker(lastPoint, { 
                    radius: 4, 
                    color: '#1e90ff', 
                    fillColor: '#1e90ff', 
                    fillOpacity: 0.8, 
                    weight: 1 
                }).addTo(map).bindPopup(p.username || "訪客");
            }
        });
    }

    initApp();
</script>
</body>
</html>
